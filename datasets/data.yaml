# ============================================================
# YOLOv8 数据集配置文件 —— 人脸检测 (当前正在使用)
#   数据: 4000 张训练 / 400 张验证, 单类别 face
#   位置: D:/yolov8/datasets/mydata
#   来源: WIDER FACE train 划分, 按「每图框数」分层抽样以保持分布一致
# ============================================================
# 路径建议用【绝对路径】, 避免因工作目录不同而找不到数据
# 注意: Windows 下路径也可以直接用反斜杠, 但 YAML 里反斜杠是转义符,
#       所以下面统一用正斜杠 / , 例如 D:/yolov8/datasets/mydata
# ============================================================

# 数据集根目录 (下面 train/val 的相对路径都相对它)
path: D:/yolov8/datasets/mydata

# 训练集图片目录 (相对 path)
train: images/train

# 验证集图片目录 (相对 path)
val: images/val

# 可选: 测试集
# test: images/test

# 类别数
nc: 1

# 类别名称, 顺序必须和标注时的 classes.txt 一致, 索引从 0 开始
names:
  0: face

# ============================================================
# 目录结构要求 (YOLO 格式):
#
# datasets/mydata/
# ├── images/
# │   ├── train/   放训练图片  xxx.jpg
# │   └── val/     放验证图片  yyy.jpg
# └── labels/
#     ├── train/   放对应标签  xxx.txt
#     └── val/     放对应标签  yyy.txt
#
# 标签 txt 格式 (每行一个目标):
#   <类别索引> <中心x> <中心y> <宽> <高>
#   坐标都是 0~1 之间的归一化值, 例如:
#   0 0.5123 0.4410 0.2210 0.5320
#   1 0.7812 0.3305 0.1150 0.2210
#
# 图片和标签文件名必须一一对应(只是扩展名不同), 例如:
#   images/train/001.jpg  <->  labels/train/001.txt
# ============================================================
